<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Campus Lost & Found</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>Campus Lost & Found</h1>
      <p class="subtitle">Report lost/found items — search by name, category, location or date.</p>
    </div>
  </header>

  <section class="controls">
    <input id="searchBar" type="text" placeholder="Search items (name, description, location)..." />
    <select id="filterCategory">
      <option value="">All Categories</option>
      <option>Accessories</option>
      <option>Books</option>
      <option>Electronics</option>
      <option>Personal ID</option>
    </select>
    <input id="filterLocation" type="text" placeholder="Location filter" />
    <input id="filterDate" type="date" />
    <button id="openModal">+ Add Item</button>
    <button id="clearFilters">Clear Filters</button>
  </section>

  <main id="itemsContainer" class="grid"></main>

  <!-- Modal -->
  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button id="closeModal" class="close" title="Close">&times;</button>
      <h2 id="modalTitle">Add Lost / Found Item</h2>

      <form id="itemForm" autocomplete="off">
        <label for="itemName">Item name</label>
        <input id="itemName" type="text" required />

        <label for="itemCategory">Category</label>
        <select id="itemCategory" required>
          <option value="">Select category</option>
          <option>Accessories</option>
          <option>Books</option>
          <option>Electronics</option>
          <option>Personal ID</option>
        </select>

        <label for="itemLocation">Location</label>
        <input id="itemLocation" type="text" required />

        <label for="itemDate">Date</label>
        <input id="itemDate" type="date" required />

        <label for="itemDescription">Description</label>
        <textarea id="itemDescription" rows="4" required></textarea>

        <label for="itemImages">Upload images (max 4)</label>
        <input id="itemImages" type="file" accept="image/*" multiple />
        <div id="imagePreview" class="image-preview" aria-hidden="true"></div>

        <div class="modal-actions">
          <button type="button" id="cancelBtn" class="btn secondary">Cancel</button>
          <button type="submit" class="btn primary">Add Item</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
